openapi: 3.0.0
info:
  description: Central Authentication Service for multi-tenant identity management.
  title: Guard CAS API
  contact: {}
  version: "1.0"
paths:
  /.well-known/oauth-authorization-server:
    get:
      description: RFC 8414 compliant discovery endpoint that returns server metadata
        including supported authentication modes
      tags:
        - auth
      summary: OAuth 2.0 Authorization Server Metadata
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/controller.oauth2MetadataResp"
  /api/v1/applications:
    get:
      description: Lists all applications for a tenant
      tags:
        - Applications
      summary: List applications
      parameters:
        - description: Limit
          name: limit
          in: query
          schema:
            type: integer
        - description: Offset
          name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      description: Creates a new application within a tenant
      tags:
        - Applications
      summary: Create application
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.createAppRequest"
        description: Application details
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/domain.Application"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  "/api/v1/applications/{id}":
    get:
      description: Gets an application by ID
      tags:
        - Applications
      summary: Get application
      parameters:
        - description: Application ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/domain.Application"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
    put:
      description: Updates an application
      tags:
        - Applications
      summary: Update application
      parameters:
        - description: Application ID
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.updateAppRequest"
        description: Updated fields
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/domain.Application"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
    delete:
      description: Deletes an application
      tags:
        - Applications
      summary: Delete application
      parameters:
        - description: Application ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/auth/admin/api-keys:
    get:
      security:
        - BearerAuth: []
      description: Returns all API keys for the caller's tenant. Raw keys are never
        returned.
      tags:
        - auth.admin
      summary: List API keys for a tenant (admin-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/controller.apiKeysListResp"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
    post:
      security:
        - BearerAuth: []
      description: Creates a new API key for service-to-service authentication. The
        raw key is returned only once.
      tags:
        - auth.admin
      summary: Create an API key (admin-only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.createAPIKeyReq"
        description: API key details
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/controller.createAPIKeyResp"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  "/api/v1/auth/admin/api-keys/{id}/revoke":
    post:
      security:
        - BearerAuth: []
      description: Revokes an API key. The key will no longer be accepted for
        authentication.
      tags:
        - auth.admin
      summary: Revoke an API key (admin-only)
      parameters:
        - description: API Key ID (UUID)
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/auth/admin/bulk/users/export:
    get:
      description: Export all users in a tenant as JSON
      tags:
        - Admin Bulk
      summary: Bulk export users
      parameters:
        - description: Export format (json or csv)
          name: format
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
  /api/v1/auth/admin/bulk/users/import:
    post:
      description: "Import users from CSV or JSON. CSV columns:
        email,first_name,last_name,role. JSON: array of objects."
      tags:
        - Admin Bulk
      summary: Bulk import users
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  description: CSV or JSON file
                  type: string
                  format: binary
              required:
                - file
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/controller.bulkImportResult"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/auth/admin/compliance/report:
    get:
      description: Generates a compliance summary report for the platform or a
        specific tenant
      tags:
        - Compliance
      summary: Compliance report
      parameters:
        - description: Tenant ID filter
          name: tenant_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/auth/admin/fga/acl/tuples:
    post:
      security:
        - BearerAuth: []
      description: Creates a direct permission grant (tuple).
      tags:
        - auth.admin
      summary: Create ACL tuple (admin-only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.fgaCreateACLTupleReq"
        description: tuple payload
        required: true
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
    delete:
      security:
        - BearerAuth: []
      description: Deletes a direct permission grant (tuple).
      tags:
        - auth.admin
      summary: Delete ACL tuple (admin-only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.fgaDeleteACLTupleReq"
        description: tuple selector
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/auth/admin/fga/groups:
    get:
      security:
        - BearerAuth: []
      description: Lists groups for the specified tenant.
      tags:
        - auth.admin
      summary: List groups for a tenant (admin-only)
      parameters:
        - description: Tenant ID (UUID)
          name: tenant_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/controller.fgaListGroupsResp"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
    post:
      security:
        - BearerAuth: []
      description: Creates a new group for the specified tenant.
      tags:
        - auth.admin
      summary: Create group (admin-only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.fgaCreateGroupReq"
        description: tenant_id, name, description
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/controller.fgaGroupItem"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  "/api/v1/auth/admin/fga/groups/{id}":
    delete:
      security:
        - BearerAuth: []
      description: Deletes a group for the specified tenant.
      tags:
        - auth.admin
      summary: Delete group (admin-only)
      parameters:
        - description: Group ID (UUID)
          name: id
          in: path
          required: true
          schema:
            type: string
        - description: Tenant ID (UUID)
          name: tenant_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/api/v1/auth/admin/fga/groups/{id}/members":
    post:
      security:
        - BearerAuth: []
      description: Adds a user to a group.
      tags:
        - auth.admin
      summary: Add user to group (admin-only)
      parameters:
        - description: Group ID (UUID)
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/controller.fgaModifyGroupMemberReq"
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
    delete:
      security:
        - BearerAuth: []
      description: Removes a user from a group.
      tags:
        - auth.admin
      summary: Remove user from group (admin-only)
      parameters:
        - description: Group ID (UUID)
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/controller.fgaModifyGroupMemberReq"
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/auth/admin/invitations:
    get:
      security:
        - BearerAuth: []
      description: Returns all invitations for the specified tenant.
      tags:
        - auth.admin
      summary: List invitations for a tenant (admin-only)
      parameters:
        - description: Tenant ID (UUID)
          name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - description: Filter by status (pending, accepted, expired, revoked)
          name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/controller.invitationsListResp"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
    post:
      security:
        - BearerAuth: []
      description: Creates an invitation for a user to join a tenant. Sends an
        invitation email with a link to accept.
      tags:
        - auth.admin
      summary: Invite a user to join a tenant (admin-only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.inviteUserReq"
        description: Invitation details
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/controller.inviteUserResp"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  "/api/v1/auth/admin/invitations/{id}":
    delete:
      security:
        - BearerAuth: []
      description: Permanently deletes an invitation.
      tags:
        - auth.admin
      summary: Delete an invitation (admin-only)
      parameters:
        - description: Invitation ID (UUID)
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  "/api/v1/auth/admin/invitations/{id}/revoke":
    post:
      security:
        - BearerAuth: []
      description: Revokes a pending invitation so it can no longer be accepted.
      tags:
        - auth.admin
      summary: Revoke an invitation (admin-only)
      parameters:
        - description: Invitation ID (UUID)
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/auth/admin/oauth-clients:
    get:
      security:
        - BearerAuth: []
      description: Returns all OAuth clients for the tenant
      tags:
        - auth.admin
      summary: List OAuth clients
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
    post:
      security:
        - BearerAuth: []
      description: Registers a new OAuth 2.0 client application
      tags:
        - auth.admin
      summary: Create OAuth client
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.createClientReq"
        description: Client configuration
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/controller.createClientResp"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  "/api/v1/auth/admin/oauth-clients/{id}":
    get:
      security:
        - BearerAuth: []
      description: Returns a single OAuth client by ID
      tags:
        - auth.admin
      summary: Get OAuth client
      parameters:
        - description: Client UUID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/domain.OAuthClient"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
    delete:
      security:
        - BearerAuth: []
      description: Deletes an OAuth client
      tags:
        - auth.admin
      summary: Delete OAuth client
      parameters:
        - description: Client UUID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
    patch:
      security:
        - BearerAuth: []
      description: Updates an existing OAuth client
      tags:
        - auth.admin
      summary: Update OAuth client
      parameters:
        - description: Client UUID
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.updateClientReq"
        description: Fields to update
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/auth/admin/platform/audit-logs:
    get:
      description: Platform-level endpoint to query audit logs across tenants
      tags:
        - Platform Admin
      summary: Query audit logs
      parameters:
        - description: Filter by tenant
          name: tenant_id
          in: query
          schema:
            type: string
        - description: Filter by user
          name: user_id
          in: query
          schema:
            type: string
        - description: Filter by action
          name: action
          in: query
          schema:
            type: string
        - description: Limit
          name: limit
          in: query
          schema:
            type: integer
        - description: Offset
          name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/auth/admin/platform/stats:
    get:
      description: Returns aggregate platform statistics
      tags:
        - Platform Admin
      summary: Platform stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/auth/admin/platform/tenants:
    get:
      description: Platform-level endpoint to list all tenants with user counts
      tags:
        - Platform Admin
      summary: List all tenants with stats
      parameters:
        - description: Limit
          name: limit
          in: query
          schema:
            type: integer
        - description: Offset
          name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/auth/admin/platform/users/search:
    get:
      description: Platform-level endpoint to search users globally
      tags:
        - Platform Admin
      summary: Search users across tenants
      parameters:
        - description: Search query (email)
          name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/auth/admin/rbac/permissions:
    get:
      security:
        - BearerAuth: []
      description: Returns all known permissions.
      tags:
        - auth.admin
      summary: List all permissions (admin-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/controller.rbacPermissionsResp"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
