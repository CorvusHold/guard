      description: Initiates the OAuth 2.0 authorization code flow (RFC 6749 §4.1.1).
        Returns consent screen data or redirects if consent was previously
        granted.
      tags:
        - OAuth
      summary: OAuth 2.0 Authorization
      parameters:
        - description: Client ID
          name: client_id
          in: query
          required: true
          schema:
            type: string
        - description: Redirect URI
          name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - description: Response type (must be 'code')
          name: response_type
          in: query
          required: true
          schema:
            type: string
        - description: Space-separated scopes
          name: scope
          in: query
          schema:
            type: string
        - description: CSRF state parameter
          name: state
          in: query
          schema:
            type: string
        - description: Nonce for ID token replay protection
          name: nonce
          in: query
          schema:
            type: string
        - description: PKCE code challenge
          name: code_challenge
          in: query
          schema:
            type: string
        - description: PKCE method (S256)
          name: code_challenge_method
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Consent screen data
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "302":
          description: Redirect with authorization code
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /oauth/authorize/decision:
    post:
      description: Processes the user's consent decision (approve or deny) for an
        OAuth authorization request.
      tags:
        - OAuth
      summary: OAuth 2.0 Authorization Decision
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.authorizeDecisionReq"
        description: Consent decision
        required: true
      responses:
        "302":
          description: Redirect with authorization code or error
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /oauth/revoke:
    post:
      description: Revokes an OAuth 2.0 token (RFC 7009). Accepts refresh_token or
        access_token.
      tags:
        - OAuth
      summary: Revoke Token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  description: The token to revoke
                  type: string
                token_type_hint:
                  description: Token type hint (refresh_token or access_token)
                  type: string
              required:
                - token
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /oauth/token:
    post:
      description: Exchanges an authorization code, client credentials, or refresh
        token for access tokens (RFC 6749 §3.2).
      tags:
        - OAuth
      summary: OAuth 2.0 Token Exchange
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  description: Grant type (authorization_code, client_credentials, refresh_token)
                  type: string
                code:
                  description: Authorization code (for authorization_code grant)
                  type: string
                redirect_uri:
                  description: Redirect URI (for authorization_code grant)
                  type: string
                client_id:
                  description: Client ID
                  type: string
                client_secret:
                  description: Client secret
                  type: string
                code_verifier:
                  description: PKCE code verifier
                  type: string
                refresh_token:
                  description: Refresh token (for refresh_token grant)
                  type: string
                scope:
                  description: Requested scopes
                  type: string
              required:
                - grant_type
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/domain.TokenResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
