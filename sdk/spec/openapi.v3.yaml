servers:
  - url: /
components:
  requestBodies:
    controller.magicVerifyReq:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/controller.magicVerifyReq"
      description: Magic token in JSON body
    domain.SCIMGroup:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/domain.SCIMGroup"
      description: Group resource
      required: true
    controller.rbacRolePermissionReq:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/controller.rbacRolePermissionReq"
      description: permission_key, scope_type, optional resource_type/resource_id
      required: true
    controller.fgaModifyGroupMemberReq:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/controller.fgaModifyGroupMemberReq"
      description: user_id
      required: true
    controller.rbacModifyUserRoleReq:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/controller.rbacModifyUserRoleReq"
      description: tenant_id, role_id
      required: true
    domain.SCIMPatchRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/domain.SCIMPatchRequest"
      description: Patch operations
      required: true
    domain.SCIMUser:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/domain.SCIMUser"
      description: User resource
      required: true
  securitySchemes:
    BearerAuth:
      type: apiKey
      name: Authorization
      in: header
  schemas:
    controller.EmailDiscoveryRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
    controller.EmailDiscoveryResponse:
      type: object
      properties:
        found:
          type: boolean
        has_tenant:
          type: boolean
        suggestions:
          type: array
          items:
            type: string
        tenant_id:
          type: string
        tenant_name:
          type: string
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/controller.TenantInfo"
        user_exists:
          type: boolean
    controller.LoginOptionsResponse:
      type: object
      properties:
        domain_matched_sso:
          description: If email domain matches an SSO provider's configured domains
          allOf:
            - $ref: "#/components/schemas/controller.SSOProviderOption"
        last_successful_method:
          description: >-
            Last successful login method for this email in this tenant (if
            known).

            Values: "sso", "password", "magic_link"
          type: string
        magic_link_enabled:
          type: boolean
        password_enabled:
          description: Authentication methods available
          type: boolean
        preferred_method:
          description: |-
            Recommended/preferred login method based on context
            Values: "sso", "password", "magic_link", "social"
          type: string
        recommended_method_reason:
          description: >-
            Reason for the top recommendation.

            Values: "sso_required", "last_successful_method", "domain_matched_sso", "preferred_method", "default_order"
          type: string
        recommended_methods:
          description: |-
            Ordered recommendation list for clients that support adaptive UI.
            Values: "sso", "password", "magic_link"
          type: array
          items:
            type: string
        signup_enabled:
          description: Whether new user signup is enabled for this tenant
          type: boolean
        social_providers:
          description: Social login providers (tenant-wide or global)
          type: array
          items:
            $ref: "#/components/schemas/controller.SocialProviderOption"
        sso_only:
          description: Explicit policy flag for SSO-only login UX.
          type: boolean
        sso_providers:
          description: SSO providers configured for this tenant
          type: array
          items:
            $ref: "#/components/schemas/controller.SSOProviderOption"
        sso_required:
          description: If true, SSO is required for this domain/tenant (password disabled)
          type: boolean
        tenant_id:
          description: Tenant information (if discovered)
          type: string
        tenant_logo_url:
          description: Tenant logo URL for branding on the login page
          type: string
        tenant_name:
          type: string
        tenants:
          description: >-
            If email is present in multiple tenants, list them so the UI can
            prompt the user.

            When multiple tenants are present, tenant_id/tenant_name will only be set when

            exactly one tenant is resolved; otherwise clients must let the user choose.
          type: array
          items:
            $ref: "#/components/schemas/controller.TenantInfo"
        user_exists:
          description: If true, user exists and can use password login
          type: boolean
    controller.SSOProviderOption:
      type: object
      properties:
        login_url:
          type: string
        logo_url:
          type: string
        name:
          type: string
        provider_type:
          description: '"oidc", "saml"'
          type: string
        slug:
          type: string
    controller.SocialProviderOption:
      type: object
      properties:
        login_url:
          type: string
        logo_url:
          type: string
        name:
          type: string
        provider:
          description: '"google", "github", "microsoft", etc.'
          type: string
    controller.TenantInfo:
      type: object
      required:
        - id
        - name
      properties:
        id:
          description: Tenant ID (UUID)
          type: string
          example: 3efda476-f0b9-47a8-b96b-5a543b88da3e
        name:
          description: Tenant display name
          type: string
          example: Acme Corp
    controller.acceptInvitationReq:
      type: object
      required:
        - password
        - token
      properties:
        first_name:
          description: Optional first name
          type: string
        last_name:
          description: Optional last name
          type: string
        password:
          description: Password for the new account (min 8 chars)
          type: string
          minLength: 8
        token:
          description: Invitation token from the invite URL
          type: string
    controller.adminCreateUserReq:
      type: object
      required:
        - email
        - password
        - tenant_id
      properties:
        email:
          description: User email address
          type: string
        email_verified:
          description: Mark email as verified
          type: boolean
        first_name:
          description: Optional first name
          type: string
        last_name:
          description: Optional last name
          type: string
        password:
          description: Password (min 8 chars)
          type: string
          minLength: 8
        roles:
          description: Optional roles to assign
          type: array
          items:
            type: string
        send_welcome:
          description: Send welcome email to user
          type: boolean
        tenant_id:
          description: Tenant ID (UUID)
          type: string
    controller.adminCreateUserResp:
      type: object
      properties:
        created_at:
          description: Creation timestamp
          type: string
        email:
          description: User email
          type: string
        email_verified:
          description: Whether email is verified
          type: boolean
        first_name:
          description: First name
          type: string
        id:
          description: User ID
          type: string
        is_active:
          description: Whether user is active
          type: boolean
        last_name:
          description: Last name
          type: string
        roles:
          description: Assigned roles
          type: array
          items:
            type: string
        tenant_id:
          description: Tenant ID
          type: string
    controller.adminUpdateNamesReq:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
    controller.adminUpdateRolesReq:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          items:
            type: string
    controller.adminUser:
      type: object
      properties:
        created_at:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        first_name:
          type: string
        id:
          type: string
        is_active:
          type: boolean
        last_login_at:
          type: string
        last_name:
          type: string
        roles:
          type: array
          items:
            type: string
        updated_at:
          type: string
    controller.adminUsersResp:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/controller.adminUser"
    controller.apiKeyItem:
      type: object
      properties:
        created_at:
          type: string
        created_by:
          type: string
        expires_at:
          type: string
        id:
          type: string
        key_prefix:
          type: string
        last_used_at:
          type: string
        name:
          type: string
        revoked_at:
          type: string
        scopes:
          type: array
          items:
            type: string
        tenant_id:
          type: string
        updated_at:
          type: string
    controller.apiKeysListResp:
      type: object
      properties:
        api_keys:
          type: array
          items:
            $ref: "#/components/schemas/controller.apiKeyItem"
