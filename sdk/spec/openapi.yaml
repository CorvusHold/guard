      parameters:
      - description: Client ID
        in: query
        name: client_id
        required: true
        type: string
      - description: Redirect URI
        in: query
        name: redirect_uri
        required: true
        type: string
      - description: Response type (must be 'code')
        in: query
        name: response_type
        required: true
        type: string
      - description: Space-separated scopes
        in: query
        name: scope
        type: string
      - description: CSRF state parameter
        in: query
        name: state
        type: string
      - description: Nonce for ID token replay protection
        in: query
        name: nonce
        type: string
      - description: PKCE code challenge
        in: query
        name: code_challenge
        type: string
      - description: PKCE method (S256)
        in: query
        name: code_challenge_method
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Consent screen data
          schema:
            additionalProperties: true
            type: object
        "302":
          description: Redirect with authorization code
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: OAuth 2.0 Authorization
      tags:
      - OAuth
