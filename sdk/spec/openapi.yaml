info:
  contact: {}
  description: Central Authentication Service for multi-tenant identity management.
  title: Guard CAS API
  version: "1.0"
paths:
  /.well-known/oauth-authorization-server:
    get:
      description: RFC 8414 compliant discovery endpoint that returns server metadata
        including supported authentication modes
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.oauth2MetadataResp'
      summary: OAuth 2.0 Authorization Server Metadata
      tags:
      - auth
  /api/v1/applications:
    get:
      description: Lists all applications for a tenant
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List applications
      tags:
      - Applications
    post:
      consumes:
      - application/json
      description: Creates a new application within a tenant
      parameters:
      - description: Application details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.createAppRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Application'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create application
      tags:
      - Applications
  /api/v1/applications/{id}:
    delete:
      description: Deletes an application
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete application
      tags:
      - Applications
    get:
      description: Gets an application by ID
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Application'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get application
      tags:
      - Applications
    put:
      consumes:
      - application/json
      description: Updates an application
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.updateAppRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Application'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update application
      tags:
      - Applications
  /api/v1/auth/admin/api-keys:
    get:
      description: Returns all API keys for the caller's tenant. Raw keys are never
        returned.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.apiKeysListResp'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List API keys for a tenant (admin-only)
      tags:
      - auth.admin
    post:
      consumes:
      - application/json
      description: Creates a new API key for service-to-service authentication. The
        raw key is returned only once.
      parameters:
      - description: API key details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.createAPIKeyReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controller.createAPIKeyResp'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an API key (admin-only)
      tags:
      - auth.admin
  /api/v1/auth/admin/api-keys/{id}/revoke:
    post:
      description: Revokes an API key. The key will no longer be accepted for authentication.
      parameters:
      - description: API Key ID (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke an API key (admin-only)
      tags:
      - auth.admin
  /api/v1/auth/admin/bulk/users/export:
    get:
      description: Export all users in a tenant as JSON
      parameters:
      - description: Export format (json or csv)
        in: query
        name: format
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Bulk export users
      tags:
      - Admin Bulk
  /api/v1/auth/admin/bulk/users/import:
    post:
      consumes:
      - multipart/form-data
      description: 'Import users from CSV or JSON. CSV columns: email,first_name,last_name,role.
        JSON: array of objects.'
      parameters:
      - description: CSV or JSON file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.bulkImportResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Bulk import users
      tags:
      - Admin Bulk
  /api/v1/auth/admin/compliance/report:
    get:
      description: Generates a compliance summary report for the platform or a specific
        tenant
      parameters:
      - description: Tenant ID filter
        in: query
        name: tenant_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Compliance report
      tags:
      - Compliance
  /api/v1/auth/admin/fga/acl/tuples:
    delete:
