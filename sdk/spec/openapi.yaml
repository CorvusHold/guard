basePath: /
definitions:
  controller.EmailDiscoveryRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  controller.EmailDiscoveryResponse:
    properties:
      found:
        type: boolean
      has_tenant:
        type: boolean
      suggestions:
        items:
          type: string
        type: array
      tenant_id:
        type: string
      tenant_name:
        type: string
      tenants:
        items:
          $ref: '#/definitions/controller.TenantInfo'
        type: array
      user_exists:
        type: boolean
    type: object
  controller.LoginOptionsResponse:
    properties:
      domain_matched_sso:
        allOf:
        - $ref: '#/definitions/controller.SSOProviderOption'
        description: If email domain matches an SSO provider's configured domains
      last_successful_method:
        description: |-
          Last successful login method for this email in this tenant (if known).
          Values: "sso", "password", "magic_link"
        type: string
      magic_link_enabled:
        type: boolean
      password_enabled:
        description: Authentication methods available
        type: boolean
      preferred_method:
        description: |-
          Recommended/preferred login method based on context
          Values: "sso", "password", "magic_link", "social"
        type: string
      recommended_method_reason:
        description: |-
          Reason for the top recommendation.
          Values: "sso_required", "last_successful_method", "domain_matched_sso", "preferred_method", "default_order"
        type: string
      recommended_methods:
        description: |-
          Ordered recommendation list for clients that support adaptive UI.
          Values: "sso", "password", "magic_link"
        items:
          type: string
        type: array
      signup_enabled:
        description: Whether new user signup is enabled for this tenant
        type: boolean
      social_providers:
        description: Social login providers (tenant-wide or global)
        items:
          $ref: '#/definitions/controller.SocialProviderOption'
        type: array
      sso_only:
        description: Explicit policy flag for SSO-only login UX.
        type: boolean
      sso_providers:
        description: SSO providers configured for this tenant
        items:
          $ref: '#/definitions/controller.SSOProviderOption'
        type: array
      sso_required:
        description: If true, SSO is required for this domain/tenant (password disabled)
        type: boolean
      tenant_id:
        description: Tenant information (if discovered)
        type: string
      tenant_logo_url:
        description: Tenant logo URL for branding on the login page
        type: string
      tenant_name:
        type: string
      tenants:
        description: |-
          If email is present in multiple tenants, list them so the UI can prompt the user.
          When multiple tenants are present, tenant_id/tenant_name will only be set when
          exactly one tenant is resolved; otherwise clients must let the user choose.
        items:
          $ref: '#/definitions/controller.TenantInfo'
        type: array
      user_exists:
        description: If true, user exists and can use password login
        type: boolean
    type: object
  controller.SSOProviderOption:
    properties:
      login_url:
        type: string
      logo_url:
        type: string
      name:
        type: string
      provider_type:
        description: '"oidc", "saml"'
        type: string
      slug:
        type: string
    type: object
  controller.SocialProviderOption:
    properties:
      login_url:
        type: string
      logo_url:
        type: string
      name:
        type: string
      provider:
        description: '"google", "github", "microsoft", etc.'
        type: string
    type: object
  controller.TenantInfo:
    properties:
      id:
        description: Tenant ID (UUID)
        example: 3efda476-f0b9-47a8-b96b-5a543b88da3e
        type: string
      name:
        description: Tenant display name
        example: Acme Corp
        type: string
    required:
    - id
    - name
    type: object
  controller.acceptInvitationReq:
    properties:
      first_name:
        description: Optional first name
        type: string
      last_name:
        description: Optional last name
        type: string
      password:
        description: Password for the new account (min 8 chars)
        minLength: 8
        type: string
      token:
        description: Invitation token from the invite URL
        type: string
    required:
    - password
    - token
    type: object
  controller.adminCreateUserReq:
    properties:
      email:
        description: User email address
        type: string
      email_verified:
        description: Mark email as verified
        type: boolean
      first_name:
        description: Optional first name
        type: string
      last_name:
        description: Optional last name
        type: string
      password:
        description: Password (min 8 chars)
        minLength: 8
        type: string
      roles:
        description: Optional roles to assign
        items:
          type: string
        type: array
      send_welcome:
        description: Send welcome email to user
        type: boolean
      tenant_id:
        description: Tenant ID (UUID)
        type: string
    required:
    - email
    - password
    - tenant_id
    type: object
  controller.adminCreateUserResp:
    properties:
      created_at:
        description: Creation timestamp
        type: string
      email:
        description: User email
        type: string
      email_verified:
        description: Whether email is verified
        type: boolean
      first_name:
        description: First name
        type: string
      id:
        description: User ID
        type: string
      is_active:
        description: Whether user is active
        type: boolean
      last_name:
        description: Last name
        type: string
      roles:
        description: Assigned roles
        items:
          type: string
        type: array
      tenant_id:
        description: Tenant ID
        type: string
    type: object
  controller.adminUpdateNamesReq:
